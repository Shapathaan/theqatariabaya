<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Qatari Abaya by Teepee's</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --maroon:#8A1538;
  --gold:#F5E6C8;
  --bg:#f4f4f4;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:var(--bg);color:#111}

/* ================= LANDING ================= */
#landing{
  position:fixed;
  inset:0;
  z-index:5000;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
}

#landing video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.landing-overlay{
  position:relative;
  z-index:2;
  text-align:center;
  color:white;
  opacity:0;
  animation:fadeIn 2s ease forwards;
  animation-delay:1.5s;
}

.landing-overlay h1{
  font-size:clamp(38px,7vw,64px);
  letter-spacing:10px;
  color:var(--gold);
  animation:titleReveal 2.5s ease forwards;
}

@keyframes titleReveal{
  from{opacity:0;letter-spacing:30px;transform:translateY(40px)}
  to{opacity:1;letter-spacing:10px;transform:translateY(0)}
}

.landing-overlay p{
  margin-top:14px;
  font-size:15px;
  letter-spacing:2px;
  opacity:0;
  animation:fadeIn 2s ease forwards;
  animation-delay:3.5s;
}

.landing-overlay button{
  margin-top:40px;
  padding:16px 50px;
  background:transparent;
  border:2px solid var(--gold);
  color:var(--gold);
  border-radius:50px;
  font-weight:700;
  letter-spacing:2px;
  cursor:pointer;
  opacity:0;
  animation:fadeIn 2s ease forwards;
  animation-delay:5s;
}

@keyframes fadeIn{to{opacity:1}}

/* ================= HEADER ================= */
header{
  position:fixed;
  top:0;left:0;right:0;
  background:#fff;
  border-bottom:3px solid var(--maroon);
  padding:10px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
  display:none;
}
.logo img{height:52px}
.admin-btn{color:var(--maroon);font-weight:700;cursor:pointer}

/* ================= BANNER ================= */
.banner{
  margin-top:72px;
  display:none;
}
.banner img{
  width:100%;
  max-height:240px;
  object-fit:cover;
}

/* ================= MENU ================= */
.glass-menu{
  display:none;
  justify-content:center;
  gap:14px;
  margin:18px auto;
  padding:12px 18px;
  width:fit-content;
  border-radius:22px;
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(14px);
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.glass-menu button{
  padding:10px 18px;
  background:linear-gradient(145deg,#8A1538,#5e0f2a);
  color:#fff;
  border:none;
  border-radius:16px;
  font-weight:600;
  cursor:pointer;
}

/* ================= SECTIONS ================= */
section{display:none;padding:32px 16px}
section.active{display:block}
.section-inner{max-width:1200px;margin:0 auto;text-align:center}

/* ================= PRODUCTS GRID ================= */
#productGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-top:24px;
}
@media(max-width:600px){
  #productGrid{grid-template-columns:repeat(2,1fr);gap:14px}
}

/* ================= CART ================= */
.cart-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:56px;height:56px;
  background:var(--maroon);
  color:#fff;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  z-index:1000;
}
.cart-drawer{
  position:fixed;
  top:0;
  right:-100%;
  width:320px;
  height:100%;
  background:#fff;
  padding:16px;
  transition:.3s;
  z-index:1001;
}
.cart-drawer.open{right:0}

footer{text-align:center;padding:16px;opacity:.6}
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing">
  <video src="qatar-flag.mp4" autoplay muted playsinline></video>

  <div class="landing-overlay">
    <h1>THE QATARI ABAYA</h1>
    <p>Qatari Elegance • Modern Modesty</p>
    <button onclick="enterSite()">SHOP NOW</button>
  </div>
</div>

<!-- MAIN SITE -->
<header>
  <div class="logo"><img src="icon-192.png"></div>
  <div class="admin-btn" onclick="navigate('admin')">Admin</div>
</header>

<div class="banner">
  <img src="qatari.png">
</div>

<div class="glass-menu">
  <button onclick="navigate('home')">Home</button>
  <button onclick="navigate('products')">Products</button>
  <button onclick="navigate('about')">About</button>
  <button onclick="navigate('contact')">Contact</button>
</div>

<section id="home" class="active">
  <div class="section-inner">
    <h2>Welcome to The Qatari Abaya</h2>
  </div>
</section>

<section id="products">
  <div class="section-inner">
    <h2>Our Collection</h2>
    <div id="productGrid"></div>
  </div>
</section>

<section id="about">
  <div class="section-inner">
    <h2>About Us</h2>
    <p style="max-width:900px;margin:0 auto;line-height:1.8">
      Qatari Elegance Meets Modern Modesty... (FULL TEXT YOU SHARED EARLIER)
    </p>
  </div>
</section>

<section id="contact">
  <div class="section-inner">
    <h2>Contact</h2>
    <p>WhatsApp: +91-87591345556</p>
  </div>
</section>

<section id="checkout">
  <div class="section-inner">
    <h2>Checkout</h2>
    <img src="UPI_QR.png" style="width:220px;margin:20px auto;display:block">
  </div>
</section>

<div class="cart-btn" onclick="toggleCart()">🛒</div>

<div class="cart-drawer" id="cart">
  <div style="display:flex;justify-content:space-between">
    <h3>Your Cart</h3>
    <span onclick="toggleCart()" style="cursor:pointer">✕</span>
  </div>

  <div id="cartItems" style="margin-top:16px"></div>

  <button onclick="navigate('checkout')" style="
    width:100%;
    margin-top:14px;
    padding:12px;
    background:#8A1538;
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:700">
    Checkout
  </button>
</div>

<footer>© 2025 The Qatari Abaya by Teepee's</footer>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAxJI4LaZu5AQyk4jJ0LTthxCGXQeJBaRQ",
  authDomain:"qatri-abaya.firebaseapp.com",
  projectId:"qatri-abaya"
});

/* LANDING CONTROL */
(function(){
  if(localStorage.getItem("entered")==="yes"){
    enterSite(true);
  }
})();

function enterSite(skip){
  localStorage.setItem("entered","yes");
  document.getElementById("landing").style.display="none";

  document.querySelector("header").style.display="flex";
  document.querySelector(".banner").style.display="block";
  document.querySelector(".glass-menu").style.display="flex";
  document.querySelector(".cart-btn").style.display="flex";

  if(!skip) navigate('products');
}
</script>

<script src="main.js"></script>
</body>
</html>
