<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Qatari Abaya by Teepee's</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --maroon:#8A1538;
  --gold:#F5E6C8;
  --bg:#f4f4f4;
  --text:#111;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Georgia","Times New Roman",serif;
}
body{
  background:var(--bg);
  color:var(--text);
}

/* ================= LANDING ================= */
#landing{
  position:fixed;
  inset:0;
  z-index:5000;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
}

#landing video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.landing-overlay{
  position:relative;
  z-index:2;
  text-align:center;
  padding:0 20px;
}

.landing-overlay h1{
  color:var(--gold);
  font-size:clamp(34px,6vw,60px);
  letter-spacing:14px;
  opacity:0;
  animation:titleReveal 2.8s ease forwards;
}

@keyframes titleReveal{
  from{
    opacity:0;
    letter-spacing:40px;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    letter-spacing:14px;
    transform:translateY(0);
  }
}

.landing-overlay p{
  margin-top:18px;
  font-size:15px;
  letter-spacing:2px;
  color:#f1f1f1;
  opacity:0;
  animation:fadeIn 2s ease forwards;
  animation-delay:2.8s;
}

.landing-overlay button{
  margin-top:42px;
  padding:16px 52px;
  background:transparent;
  border:2px solid var(--gold);
  color:var(--gold);
  border-radius:50px;
  font-weight:700;
  letter-spacing:2px;
  cursor:pointer;
  opacity:0;
  animation:fadeIn 2s ease forwards;
  animation-delay:4.5s;
}

@keyframes fadeIn{
  to{opacity:1}
}

/* ================= HEADER ================= */
header{
  position:fixed;
  top:0;left:0;right:0;
  background:#fff;
  border-bottom:3px solid var(--maroon);
  padding:10px 16px;
  display:none;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}
.logo img{height:52px}
.admin-btn{color:var(--maroon);font-weight:700;cursor:pointer}

/* ================= BANNER ================= */
.banner{
  margin-top:72px;
  display:none;
}
.banner img{
  width:100%;
  max-height:240px;
  object-fit:cover;
}

/* ================= MENU ================= */
.glass-menu{
  display:none;
  justify-content:center;
  gap:14px;
  margin:18px auto;
  padding:12px 18px;
  width:fit-content;
  border-radius:22px;
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(14px);
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.glass-menu button{
  padding:10px 18px;
  background:linear-gradient(145deg,#8A1538,#5e0f2a);
  color:#fff;
  border:none;
  border-radius:16px;
  font-weight:600;
  cursor:pointer;
}

/* ================= SECTIONS ================= */
section{
  display:none;
  padding:32px 16px;
}
section.active{display:block}
.section-inner{
  max-width:1200px;
  margin:0 auto;
  text-align:center;
}

/* ================= PRODUCT GRID (FIXED) ================= */
#productGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-top:24px;
}

.product-card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 12px 24px rgba(0,0,0,.18);
}

.product-thumb{
  width:100%;
  height:200px;
  object-fit:cover;
  cursor:pointer;
}

.product-info{
  padding:10px;
}
.product-info h4{
  font-size:15px;
  margin-bottom:4px;
}
.product-info p{
  color:var(--maroon);
  font-weight:700;
}

/* Tablet */
@media(max-width:1000px){
  #productGrid{grid-template-columns:repeat(3,1fr)}
}

/* Mobile */
@media(max-width:600px){
  #productGrid{grid-template-columns:repeat(2,1fr);gap:14px}
  .product-thumb{height:150px}
}

/* ================= CART ================= */
.cart-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:56px;
  height:56px;
  background:var(--maroon);
  color:#fff;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  z-index:1000;
}

.cart-drawer{
  position:fixed;
  top:0;
  right:-100%;
  width:320px;
  height:100%;
  background:#fff;
  padding:16px;
  transition:.3s;
  z-index:1001;
}
.cart-drawer.open{right:0}

/* ================= VIDEO MODAL ================= */
#videoModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:2000;
  align-items:center;
  justify-content:center;
}

footer{
  text-align:center;
  padding:16px;
  opacity:.6;
}
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing">
  <video src="qatar-flag.mp4" autoplay muted loop playsinline></video>
  <div class="landing-overlay">
    <h1>THE QATARI ABAYA</h1>
    <p>Qatari Elegance • Modern Modesty</p>
    <button onclick="enterSite()">SHOP NOW</button>
  </div>
</div>

<!-- MAIN SITE -->
<header>
  <div class="logo"><img src="icon-192.png"></div>
  <div class="admin-btn" onclick="navigate('admin')">Admin</div>
</header>

<div class="banner">
  <img src="qatari.png">
</div>

<div class="glass-menu">
  <button onclick="navigate('products')">Products</button>
  <button onclick="navigate('about')">About Us</button>
  <button onclick="navigate('contact')">Contact Us</button>
  <button onclick="toggleCart()">Cart</button>
</div>

<section id="products" class="active">
  <div class="section-inner">
    <h2>Our Collection</h2>
    <div id="productGrid"></div>
  </div>
</section>

<section id="about">
  <div class="section-inner">
    <h2>About Us</h2>
    <p style="max-width:900px;margin:0 auto;line-height:1.8">
      Qatari Elegance Meets Modern Modesty — your full About Us content stays here.
    </p>
  </div>
</section>

<section id="contact">
  <div class="section-inner">
    <h2>Contact Us</h2>
    <p>WhatsApp: +91-87591345556</p>
  </div>
</section>

<section id="checkout">
  <div class="section-inner">
    <h2>Checkout</h2>
    <img src="UPI_QR.png" style="width:220px;margin:20px auto;display:block">
  </div>
</section>

<section id="admin">
  <div class="section-inner">
    <h2>Admin Login</h2>
    <form onsubmit="loginAdmin(event)">
      <input id="adminEmail" placeholder="Admin Email" required>
      <input id="adminPassword" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="loginStatus"></p>
  </div>
</section>

<div class="cart-btn" onclick="toggleCart()">🛒</div>

<div class="cart-drawer" id="cart">
  <div style="display:flex;justify-content:space-between">
    <h3>Your Cart</h3>
    <span onclick="toggleCart()" style="cursor:pointer">✕</span>
  </div>

  <div id="cartItems" style="margin-top:16px"></div>

  <p id="emptyCartMsg" style="margin-top:20px;opacity:.6">
    Your cart is empty
  </p>

  <button onclick="navigate('checkout')" style="
    width:100%;
    margin-top:14px;
    padding:12px;
    background:#8A1538;
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:700">
    Proceed to Checkout
  </button>
</div>

<!-- VIDEO MODAL -->
<div id="videoModal" onclick="closeVideo()">
  <video id="modalVideo" controls playsinline preload="none"
    style="width:90%;max-width:420px;background:black"></video>
</div>

<footer>© 2025 The Qatari Abaya by Teepee's</footer>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAxJI4LaZu5AQyk4jJ0LTthxCGXQeJBaRQ",
  authDomain:"qatri-abaya.firebaseapp.com",
  projectId:"qatri-abaya"
});

/* ENTER SITE */
function enterSite(){
  document.getElementById("landing").style.display="none";
  document.querySelector("header").style.display="flex";
  document.querySelector(".banner").style.display="block";
  document.querySelector(".glass-menu").style.display="flex";
  document.querySelector(".cart-btn").style.display="flex";
}
</script>

<script src="main.js"></script>
</body>
</html>
