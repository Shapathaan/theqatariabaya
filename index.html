<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Qatari Abaya by Teepee's</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --maroon:#8A1538;
  --white:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#fff;overflow:hidden}

/* ================= LANDING ================= */
#landing{
  position:fixed;
  inset:0;
  z-index:3000;
  display:flex;
}

/* FLAG SIDE */
.flag-panel{
  width:45%;
  background:#fff;
  position:relative;
  overflow:hidden;
}

.flag{
  position:absolute;
  inset:0;
  background:#fff;
  clip-path:polygon(
    0 0,90% 0,100% 6%,90% 12%,100% 18%,90% 24%,100% 30%,
    90% 36%,100% 42%,90% 48%,100% 54%,90% 60%,100% 66%,
    90% 72%,100% 78%,90% 84%,100% 90%,90% 100%,0 100%
  );
  animation:flagIn 2.4s ease forwards;
  transform:translateX(-100%);
}

@keyframes flagIn{
  to{transform:translateX(0)}
}

/* BRAND SIDE */
.brand-panel{
  width:55%;
  background:var(--maroon);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  text-align:center;
}

.brand{
  opacity:0;
  animation:brandFade 1.6s ease forwards;
  animation-delay:2.4s;
}

@keyframes brandFade{
  to{opacity:1}
}

.brand h1{
  font-size:48px;
  letter-spacing:5px;
  margin-bottom:14px;
  animation:titleReveal 1.6s ease forwards;
}

@keyframes titleReveal{
  from{letter-spacing:20px;opacity:0}
  to{letter-spacing:5px;opacity:1}
}

.brand p{
  opacity:.9;
  font-size:16px;
  margin-bottom:30px;
  animation:fadeIn 1.2s ease forwards;
  animation-delay:3.6s;
  opacity:0;
}

.shop-btn{
  padding:16px 44px;
  background:#fff;
  color:var(--maroon);
  border:none;
  border-radius:40px;
  font-weight:700;
  font-size:17px;
  cursor:pointer;
  opacity:0;
  animation:fadeIn 1.2s ease forwards;
  animation-delay:4.4s;
}

@keyframes fadeIn{to{opacity:1}}

/* ================= MOBILE ================= */
@media(max-width:768px){
  #landing{flex-direction:column}

  .flag-panel{
    width:100%;
    height:40%;
  }

  .brand-panel{
    width:100%;
    height:60%;
  }

  .brand h1{
    font-size:34px;
    letter-spacing:3px;
  }
}

/* ================= MAIN SITE (HIDDEN INITIALLY) ================= */
header,.glass-menu,.cart-btn{display:none}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;
  background:#fff;
  border-bottom:3px solid var(--maroon);
  padding:10px 16px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:1000;
}
.logo img{height:52px}
.admin-btn{color:var(--maroon);font-weight:700;cursor:pointer}

/* MENU */
.glass-menu{
  display:flex;justify-content:center;gap:14px;
  margin:100px auto 20px;
  padding:12px 18px;
  border-radius:22px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(14px);
}

/* SECTIONS */
section{display:none;padding:32px 16px}
section.active{display:block}
.section-inner{max-width:1200px;margin:0 auto;text-align:center}

/* CART */
.cart-btn{
  position:fixed;bottom:20px;right:20px;
  width:56px;height:56px;
  background:var(--maroon);color:#fff;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;z-index:1000;
}
.cart-drawer{
  position:fixed;top:0;right:-100%;
  width:320px;height:100%;
  background:#fff;padding:16px;
  transition:.3s;z-index:1001;
}
.cart-drawer.open{right:0}

footer{text-align:center;padding:16px;opacity:.6}
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing">
  <div class="flag-panel">
    <div class="flag"></div>
  </div>

  <div class="brand-panel">
    <div class="brand">
      <h1>THE QATARI ABAYA</h1>
      <p>Qatari Elegance Meets Modern Modesty</p>
      <button class="shop-btn" onclick="enterSite()">Shop Now</button>
    </div>
  </div>
</div>

<!-- MAIN SITE -->
<header>
  <div class="logo"><img src="icon-192.png"></div>
  <div class="admin-btn" onclick="navigate('admin')">Admin</div>
</header>

<div class="glass-menu">
  <button onclick="navigate('products')">Products</button>
  <button onclick="navigate('about')">About</button>
  <button onclick="navigate('contact')">Contact</button>
  <button onclick="navigate('checkout')">Checkout</button>
</div>

<section id="products">
  <div class="section-inner">
    <h2>Our Collection</h2>
    <div id="productGrid"></div>
  </div>
</section>

<section id="about"><div class="section-inner"><h2>About</h2></div></section>
<section id="contact"><div class="section-inner"><h2>Contact</h2></div></section>
<section id="checkout"><div class="section-inner"><h2>Checkout</h2></div></section>
<section id="admin"><div class="section-inner"><h2>Admin</h2></div></section>

<div class="cart-btn" onclick="toggleCart()">🛒</div>
<div class="cart-drawer" id="cart">
  <div id="cartItems"></div>
  <h3>Total: ₹<span id="cartTotal">0</span></h3>
</div>

<footer>© 2025 The Qatari Abaya by Teepee's</footer>

<script>
function enterSite(){
  document.getElementById("landing").style.display="none";
  document.body.style.overflow="auto";
  document.querySelector("header").style.display="flex";
  document.querySelector(".glass-menu").style.display="flex";
  document.querySelector(".cart-btn").style.display="flex";
  navigate('products');
}
</script>

<script src="main.js"></script>
</body>
</html>
