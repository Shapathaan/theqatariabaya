<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Qatari Abaya by Teepee's</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --maroon:#8A1538;
  --white:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#fff;overflow:hidden}

/* ================= LANDING ================= */
#landing{
  position:fixed;
  inset:0;
  background:var(--maroon);
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* QATAR FLAG */
.flag{
  position:absolute;
  left:-120%;
  top:0;
  height:100%;
  width:72%;
  background:#fff;
  z-index:1;
  clip-path:polygon(
    0 0,95% 0,100% 6%,95% 12%,100% 18%,95% 24%,100% 30%,
    95% 36%,100% 42%,95% 48%,100% 54%,95% 60%,100% 66%,
    95% 72%,100% 78%,95% 84%,100% 90%,95% 96%,100% 100%,0 100%
  );
  animation:flagIn 2.2s ease forwards;
}

@keyframes flagIn{
  to{left:0}
}

/* BRAND TEXT */
.brand{
  position:relative;
  z-index:2;
  text-align:center;
  color:#fff;
  opacity:0;
  transform:scale(.85);
  animation:brandIn 1.8s ease forwards;
  animation-delay:2.2s;
}

@keyframes brandIn{
  to{opacity:1;transform:scale(1)}
}

.brand h1{
  font-size:46px;
  letter-spacing:6px;
  animation:letterIn 1.8s ease forwards;
}

@keyframes letterIn{
  from{letter-spacing:20px;opacity:0}
  to{letter-spacing:6px;opacity:1}
}

.brand p{
  margin-top:12px;
  font-size:16px;
  opacity:0;
  animation:fadeIn 1.4s ease forwards;
  animation-delay:3.6s;
}

/* SHOP BUTTON */
.shop-btn{
  margin-top:40px;
  padding:16px 44px;
  background:#fff;
  color:var(--maroon);
  border:none;
  border-radius:40px;
  font-weight:700;
  font-size:17px;
  cursor:pointer;
  opacity:0;
  animation:fadeIn 1.4s ease forwards;
  animation-delay:4.4s;
}

@keyframes fadeIn{
  to{opacity:1}
}

/* ================= MAIN SITE (HIDDEN INITIALLY) ================= */
header,.glass-menu,.cart-btn{display:none}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;
  background:#fff;
  border-bottom:3px solid var(--maroon);
  padding:10px 16px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:1000;
}
.logo img{height:52px}
.admin-btn{color:var(--maroon);font-weight:700;cursor:pointer}

/* MENU */
.glass-menu{
  display:flex;justify-content:center;gap:14px;
  margin:100px auto 20px;
  padding:12px 18px;
  width:fit-content;border-radius:22px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(14px);
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.glass-menu button{
  padding:10px 18px;
  background:linear-gradient(145deg,#8A1538,#5e0f2a);
  color:#fff;border:none;border-radius:16px;
  font-weight:600;cursor:pointer;
}

/* SECTIONS */
section{display:none;padding:32px 16px}
section.active{display:block}
.section-inner{max-width:1200px;margin:0 auto;text-align:center}

/* PRODUCTS */
#productGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.product-card{
  background:#fff;
  border-radius:18px;
  box-shadow:0 14px 28px rgba(0,0,0,.22);
  overflow:hidden;
}
.product-thumb{width:100%;height:220px;object-fit:cover;cursor:pointer}
.product-info{padding:10px}
.product-info p{color:var(--maroon);font-weight:700}

/* CART */
.cart-btn{
  position:fixed;bottom:20px;right:20px;
  width:56px;height:56px;
  background:var(--maroon);color:#fff;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;z-index:1000;
}
.cart-drawer{
  position:fixed;top:0;right:-100%;
  width:320px;height:100%;
  background:#fff;padding:16px;
  transition:.3s;z-index:1001;
}
.cart-drawer.open{right:0}

/* VIDEO MODAL */
#videoModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:2000;
  align-items:center;
  justify-content:center;
}

footer{text-align:center;padding:16px;opacity:.6}
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing">
  <div class="flag"></div>
  <div class="brand">
    <h1>THE QATARI ABAYA</h1>
    <p>by Teepee's</p>
    <button class="shop-btn" onclick="enterSite()">Shop Now</button>
  </div>
</div>

<!-- MAIN SITE -->
<header>
  <div class="logo"><img src="icon-192.png"></div>
  <div class="admin-btn" onclick="navigate('admin')">Admin</div>
</header>

<div class="glass-menu">
  <button onclick="navigate('products')">Products</button>
  <button onclick="navigate('about')">About</button>
  <button onclick="navigate('contact')">Contact</button>
  <button onclick="navigate('checkout')">Checkout</button>
</div>

<section id="products">
  <div class="section-inner">
    <h2>Our Collection</h2>
    <div id="productGrid"></div>
  </div>
</section>

<section id="about"><div class="section-inner"><h2>About Us</h2></div></section>
<section id="contact"><div class="section-inner"><h2>Contact</h2></div></section>
<section id="checkout"><div class="section-inner"><h2>Checkout</h2></div></section>
<section id="admin"><div class="section-inner"><h2>Admin</h2></div></section>

<div class="cart-btn" onclick="toggleCart()">🛒</div>

<div class="cart-drawer" id="cart">
  <div id="cartItems"></div>
  <h3>Total: ₹<span id="cartTotal">0</span></h3>
</div>

<div id="videoModal" onclick="closeVideo()">
  <video id="modalVideo" controls playsinline preload="none"></video>
</div>

<footer>© 2025 The Qatari Abaya by Teepee's</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAxJI4LaZu5AQyk4jJ0LTthxCGXQeJBaRQ",
  authDomain:"qatri-abaya.firebaseapp.com",
  projectId:"qatri-abaya"
});

function enterSite(){
  document.getElementById("landing").style.display="none";
  document.body.style.overflow="auto";
  document.querySelector("header").style.display="flex";
  document.querySelector(".glass-menu").style.display="flex";
  document.querySelector(".cart-btn").style.display="flex";
  navigate('products');
}
</script>

<script src="main.js"></script>
</body>
</html>
