<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Qatari Abaya by Teepee's</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --maroon:#8A1538;
  --gold:#F5E6C8;
  --bg:#f4f4f4;
  --text:#111;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif}
body{background:var(--bg);color:var(--text)}

/* ===== HEADER ===== */
header{
  position:fixed;
  top:0;left:0;right:0;
  height:72px;
  background:#fff;
  border-bottom:3px solid var(--maroon);
  padding:10px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:3000;
}
.logo img{height:52px}
.admin-btn{color:var(--maroon);font-weight:700;cursor:pointer}

/* ===== BANNER ===== */
.banner{margin-top:72px}
.banner img{width:100%;max-height:240px;object-fit:cover}

/* ===== MENU ===== */
.glass-menu{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:18px auto;
  padding:12px 18px;
  border-radius:22px;
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(14px);
}
.glass-menu button{
  padding:10px 18px;
  background:linear-gradient(145deg,#8A1538,#5e0f2a);
  color:#fff;
  border:none;
  border-radius:16px;
  cursor:pointer;
}

/* ===== SECTIONS ===== */
section{display:none;padding:32px 16px}
section.active{display:block}
.section-inner{max-width:1200px;margin:auto;text-align:center}

/* ===== PRODUCTS ===== */
#productGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
.product-card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 12px 24px rgba(0,0,0,.18);
  overflow:hidden;
}
.product-thumb{
  width:100%;
  height:200px;
  object-fit:cover;
  cursor:pointer;
}
.product-info{padding:10px}
.product-info p{color:var(--maroon);font-weight:700}

@media(max-width:1000px){#productGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){#productGrid{grid-template-columns:repeat(2,1fr)}}

/* ===== CART ===== */
.cart-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:56px;height:56px;
  background:var(--maroon);
  color:#fff;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  cursor:pointer;
  z-index:3000;
}
.cart-btn span{
  position:absolute;
  top:-6px;right:-6px;
  background:#e0002a;
  width:20px;height:20px;
  border-radius:50%;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:12px;
}

.cart-drawer{
  position:fixed;
  top:72px;
  right:-100%;
  width:340px;
  height:calc(100% - 72px);
  background:#fff;
  padding:16px;
  transition:.3s;
  z-index:2000;
  overflow-y:auto;
}
.cart-drawer.open{right:0}

/* ===== VIDEO ===== */
#videoModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:4000;
  justify-content:center;
  align-items:center;
}

footer{text-align:center;padding:16px;opacity:.6}
</style>
</head>

<body>

<header>
  <div class="logo"><img src="icon-192.png"></div>
  <div class="admin-btn" onclick="navigate('admin')">Admin</div>
</header>

<div class="banner">
  <img src="qatari.png">
</div>

<div class="glass-menu">
  <button onclick="navigate('products')">Products</button>
  <button onclick="navigate('about')">About</button>
  <button onclick="navigate('contact')">Contact</button>
  <button onclick="toggleCart()">Cart</button>
</div>

<section id="products" class="active">
  <div class="section-inner">
    <h2>Our Collection</h2>
    <div id="productGrid"></div>
  </div>
</section>

<section id="about">
  <div class="section-inner">
    <h2>Qatari Elegance Meets Modern Modesty</h2>
    <p style="max-width:900px;margin:auto;line-height:1.9">
      Premium abayas inspired by Qatar. Designed for modern elegance.
    </p>
  </div>
</section>

<section id="contact">
  <div class="section-inner">
    <h2>Contact</h2>
    <p>WhatsApp: +91-87591345556</p>
  </div>
</section>

<section id="admin">
  <div class="section-inner" style="max-width:420px">
    <h2>Admin Panel</h2>

    <form onsubmit="loginAdmin(event)">
      <input id="adminEmail" placeholder="Email" required>
      <input id="adminPassword" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="loginStatus"></p>

    <div id="adminPanel" style="display:none">
      <h3>Add / Edit Product</h3>
      <input id="pName" placeholder="Name">
      <input id="pPrice" type="number" placeholder="Price">
      <input id="pVideo" placeholder="Video URL" readonly>
      <button onclick="openCloudinary()">Upload Video</button>
      <button onclick="uploadProduct()">Save</button>
      <div id="adminProducts"></div>
    </div>
  </div>
</section>

<div class="cart-btn" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div>

<div class="cart-drawer" id="cart">
  <div style="display:flex;justify-content:space-between">
    <h3>Your Cart</h3>
    <span onclick="toggleCart()" style="cursor:pointer">✕</span>
  </div>

  <div id="cartItems"></div>

  <div id="cartFooter" style="display:none">
    <input id="custName" placeholder="Name">
    <input id="custPhone" placeholder="Phone">
    <textarea id="custAddress" placeholder="Address"></textarea>
    <button onclick="checkoutWhatsApp()">Checkout via WhatsApp</button>
  </div>

  <p id="emptyCartMsg">Your cart is empty</p>
</div>

<div id="videoModal" onclick="closeVideo()">
  <video id="modalVideo" controls style="width:90%;max-width:420px"></video>
</div>

<footer>© 2025 The Qatari Abaya by Teepee's</footer>

<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  projectId:"qatri-abaya"

</script>

<script src="main.js"></script>
</body>
</html>
